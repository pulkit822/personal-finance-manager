spring.application.name=personal-finance-manager
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Session cookie hardening (COOKIE_SECURE=true is set in the Docker image for HTTPS hosting)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Database: in-memory H2 by default; override DB_URL/DB_USERNAME/DB_PASSWORD for PostgreSQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:pfm;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Time zone used for "today" (future-date checks, default goal start date)
app.timezone=${APP_TIMEZONE:UTC}
